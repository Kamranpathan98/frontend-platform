<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Closure scope diagram</title>
  <desc id="desc">Three nested boxes: global scope contains the makeCounter() call, which contains the increment() function. A dashed arrow shows increment() reaching back into the makeCounter() call's scope to read and update count.</desc>

  <rect x="0" y="0" width="800" height="500" fill="#ffffff" />

  <rect x="20" y="20" width="760" height="460" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" />
  <text x="44" y="56" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="600" fill="#334155">Global scope</text>

  <rect x="70" y="90" width="640" height="340" rx="12" fill="#eef2ff" stroke="#818cf8" stroke-width="2" />
  <text x="94" y="126" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#3730a3">makeCounter() call</text>
  <text x="94" y="152" font-family="ui-monospace, monospace" font-size="15" fill="#4338ca">count = 2</text>

  <rect x="130" y="190" width="500" height="200" rx="12" fill="#ecfdf5" stroke="#34d399" stroke-width="2" />
  <text x="154" y="226" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600" fill="#065f46">increment() function</text>
  <text x="154" y="252" font-family="ui-monospace, monospace" font-size="14" fill="#047857">(no local vars of its own)</text>

  <path d="M 300 300 C 260 280, 200 220, 160 165" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)" />
  <text x="330" y="320" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#0f766e">reads/writes "count"</text>
  <text x="330" y="340" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#0f766e">via the closure</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#0f766e" />
    </marker>
  </defs>
</svg>
